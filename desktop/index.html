<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' phone: data:; media-src phone:; connect-src 'self' phone:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>音栖</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand"><img class="logo" src="assets/yinqi.png"><div>音栖<small>YINQI / DESKTOP</small></div></div><div class="device"><span id="connectionDot" class="dot"></span><span id="deviceName">尚未连接手机</span></div><button id="connectButton" class="quiet">连接手机 <span>↗</span></button><p class="eyebrow">作品库</p><button class="nav active" data-page="library">▦ <span>全部作品</span><small id="libraryCount">0</small></button><button class="nav" data-page="favorites">♡ <span>我的收藏</span></button><button class="nav" data-page="queue">≡ <span>播放队列</span><small id="queueCount">0</small></button><button class="nav" data-page="player">♫ <span>正在播放</span></button><div class="asideBottom"><span id="syncState">与手机共用作品库</span><button id="settingsButton" class="quiet">⚙ 设置</button></div></aside>
<main><header><div><p class="eyebrow" id="pageEyebrow">YOUR PRIVATE COLLECTION</p><h1 id="pageTitle">作品库</h1></div><div class="headerActions"><button id="refresh" class="icon" title="刷新作品库">↻</button><button id="locate" class="icon" title="定位当前作品">⌖</button></div></header>
<section id="libraryPage"><div class="toolbar"><input id="search" placeholder="搜索作品名、RJ 编号、社团或声优"><select id="rootFilter"><option value="">所有目录</option></select><button id="filterButton">筛选与排序</button></div><div id="activeFilters" class="chips"></div><p id="resultCount" class="muted"></p><div id="workGrid" class="workGrid"></div><div id="libraryEmpty" class="empty"><div>◒</div><h2>让声音，从手机来到桌面</h2><p>手机开启局域网共享，在这里连接同一 Wi-Fi 下的手机。</p><button id="emptyConnect" class="primary">连接手机</button></div></section>
<section id="detailPage" hidden><button id="detailBack" class="quiet">‹ 返回作品库</button><div id="detailHeader" class="detailHeader"></div><div class="sectionHeading"><h2>曲目</h2><button id="batchQueue">选择曲目</button></div><div id="trackList"></div></section>
<section id="queuePage" hidden><div class="sectionHeading"><p class="muted">拖动排序柄调整顺序；右键曲目可移除。</p><button id="clearQueue">清空待播</button></div><div id="queueList"></div></section>
<section id="playerPage" hidden><div id="playerHeading"><h2 id="trackTitle">尚未播放</h2><p id="trackWork" class="muted"></p></div><div class="lyricStage"><img id="playerArt"><div id="shade"></div><div id="lyrics"></div><button id="follow" class="icon" title="定位当前字幕">⌖</button></div><div class="playerOptions"><button id="playerFavorite">♡ 收藏</button><button id="bookmarkButton">书签与定位</button><button id="sleepButton">睡眠定时</button><select id="speed"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div></section>
</main>
<footer id="mini"><button id="openPlayer" class="miniIdentity"><img id="miniArt"><span><strong id="miniTitle">选择一首音声，开始聆听</strong><small id="miniWork">音频由手机实时提供</small></span></button><div class="transport"><div class="transportButtons"><button id="previous" title="上一首">|‹</button><button id="rewind" title="后退 15 秒">−15</button><button id="play" class="play">▶</button><button id="forward" title="前进 15 秒">+15</button><button id="next" title="下一首">›|</button></div><div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div><div class="volume"><span>♪</span><input id="volume" type="range" min="0" max="1" step=".01" value=".7"><button id="miniQueue" class="icon" title="播放队列">≡</button><button id="collapse" class="icon" title="收起播放栏">⌄</button></div></footer>
<dialog id="modal"><div id="modalBody"></div></dialog><div id="contextMenu" hidden></div><div id="toast" hidden></div><audio id="audio" preload="metadata"></audio><script src="renderer.js"></script></body></html>
